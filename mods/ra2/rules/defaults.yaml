^AffectedByGiantSquid:
	# RA2's SquidGrab (ParasitePlus warhead): the Giant Squid latches onto a ship, holds it in place
	# (Paralyzes) and hurts it until the ship dies or the squid is removed. Uses the infection
	# machinery of the Terror Drone; the squid's AttackInfect holds the damage values.
	Targetable@SquidGrabbable:
		TargetTypes: SquidGrabbable
		RequiresCondition: !squid-grabbed
	Targetable@SquidGrabbed:
		TargetTypes: SquidGrabbed
		RequiresCondition: squid-grabbed
	Infectable:
		BeingInfectedCondition: being-squid-grabbed
		InfectedCondition: squid-grabbed
		KillInfectorCondition: invulnerability
	SpeedMultiplier@SquidGrabbed:
		Modifier: 0
		RequiresCondition: being-squid-grabbed || squid-grabbed
	WithInfectorOverlay@SquidGrab:
		Image: sqdg
		StartSequence: grab
		Sequence: hold

^ParachutableAffectedByTerrorDrone:
	Targetable@Parasiteable:
		TargetTypes: DroneParasiteable
		RequiresCondition: !parachute && !infected
	Targetable@byTerrorDrone:
		TargetTypes: ValidForTerrorDrone
		RequiresCondition: !parachute
	Targetable@InfectedByTerrorDrone:
		TargetTypes: TerrorDroned
		RequiresCondition: !parachute && infected
