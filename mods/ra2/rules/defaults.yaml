# RA2 Bombable: a Crazy Ivan can stick a timed bomb on it (vehicles, ships and buildings,
# and the infantry rules.ini marks Bombable=yes). Ivan's IvanBomber only targets IvanBomb.
^IvanBombable:
	Targetable@IVANBOMB:
		TargetTypes: IvanBomb
		RequiresCondition: !ivan-bomb
	IvanBombCarrier:

^ChronoDisable:
	# RA2 Temporal: Chrono Legionnaire beams freeze and then erase the actor.
	ChronoErasable:
	WithColoredOverlay@CHRONO:
		RequiresCondition: chronodisable
		Color: 80C8FF80
	TimedConditionBar@ChronoDisable:
		Condition: chronodisable
		Color: FFFFFF
	Mobile:
		PauseOnCondition: chronodisable
	ExternalCondition@CHRONODISABLE:
		Condition: chronodisable

