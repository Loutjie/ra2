# Wrecks fade out within about 30 seconds, so they never pile up.
^Husk:
	ChangesHealth@FADE:
		PercentageStep: -4
		Delay: 25
		StartIfBelow: 101

# Sorties leave the map after their run instead of flying back to rearm.
orca:
	-Rearmable:
