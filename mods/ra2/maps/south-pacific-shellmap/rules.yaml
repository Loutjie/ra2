^BaseWorld:
	TerrainLighting:
		RedTint: 1.12
		GreenTint: 1.12
		Intensity: 0.75
		HeightStep: 0.025

Player:
	-ConquestVictoryConditions:

World:
	-CrateSpawner:
	-AutoSave:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-StartGameNotification:
	MusicPlaylist:
		StartingMusic: grinder
		DisableWorldSounds: true
	LuaScript:
		Scripts: shellmap.lua
	# The strip is fought over forever: clear craters and scorch marks within a minute so it never fills up.
	SmudgeDecay:
		Duration: 1500

^Palettes:
	-MenuPostProcessEffect:

